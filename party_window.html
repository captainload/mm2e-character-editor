<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>MM2CG — Party Display</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="styles.css?v=41">
  <script>
    (function() {
      function applySavedThemeAndFonts() {
        const root = document.documentElement;
        const savedTheme = localStorage.getItem("mm2e_theme") || "light";
        root.setAttribute("data-theme", savedTheme);

        const savedLabelFont = Math.max(14, parseInt(localStorage.getItem("mm2e_font_labels") || localStorage.getItem("mm4e_font_labels") || "16", 10));
        const savedControlFont = Math.max(12, parseInt(localStorage.getItem("mm2e_font_controls") || localStorage.getItem("mm4e_font_controls") || "14", 10));
        const savedTagFont = Math.max(10, parseInt(localStorage.getItem("mm2e_font_tags") || localStorage.getItem("mm2e_font_links") || localStorage.getItem("mm4e_font_links") || "13", 10));
        const savedSecondaryFont = Math.max(12, parseInt(localStorage.getItem("mm2e_font_secondary") || localStorage.getItem("mm4e_font_secondary") || "14", 10));
        const savedMinorControlFont = Math.max(11, parseInt(localStorage.getItem("mm2e_font_minor_controls") || localStorage.getItem("mm4e_font_minor_controls") || "15", 10));
        const savedFinePrintFont = Math.max(10, parseInt(localStorage.getItem("mm2e_font_fine_print") || "13", 10));

        root.style.setProperty("--font-size-labels", savedLabelFont + "px");
        root.style.setProperty("--font-size-controls", savedControlFont + "px");
        root.style.setProperty("--font-size-tags", savedTagFont + "px");
        root.style.setProperty("--font-size-links", savedTagFont + "px");
        root.style.setProperty("--font-size-secondary", savedSecondaryFont + "px");
        root.style.setProperty("--font-size-minor-controls", savedMinorControlFont + "px");
        root.style.setProperty("--font-size-fine-print", savedFinePrintFont + "px");
      }
      applySavedThemeAndFonts();
      window.__applySavedThemeAndFonts = applySavedThemeAndFonts;
      window.addEventListener("storage", function(e) {
        if (!e.key || e.key.startsWith("mm2e_") || e.key.startsWith("mm4e_")) {
          applySavedThemeAndFonts();
        }
      });
    })();
  </script>
  <style>
    body {
      margin: 0;
      padding: 12px;
      background: var(--bg-app);
      color: var(--text-main);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      display: flex;
      flex-direction: column;
      height: 100vh;
      box-sizing: border-box;
      overflow: hidden;
    }
    .party-win-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      padding-bottom: 8px;
      border-bottom: 1px solid var(--border-color);
      flex-shrink: 0;
      flex-wrap: wrap;
    }
    .party-win-container {
      flex: 1;
      overflow-x: auto;
      overflow-y: auto;
      margin-top: 8px;
      border: 1px solid var(--border-color);
      border-radius: 6px;
      background: var(--bg-panel);
    }
  </style>
</head>
<body>
  <!-- Top Header Bar -->
  <div class="party-win-header">
    <div style="display: flex; align-items: center; gap: 8px;">
      <strong style="font-size: var(--font-size-labels, 15px); display: flex; align-items: center; gap: 6px; color: var(--accent-primary);">
        🛡️ Party Display
      </strong>
      <span class="secondary-text" style="font-size: var(--font-size-fine-print, 12px); color: var(--text-muted);">
        (Damage tracks &amp; conditions synchronized)
      </span>
      <span class="badge" id="lblPartyWinStatus" style="background: rgba(16, 185, 129, 0.15); color: #10b981; border: 1px solid #10b981; font-weight: 600; font-size: 11px;">Live Sync</span>
    </div>
    <div style="display: flex; align-items: center; gap: 8px;">
      <button type="button" class="btn btn-secondary" id="btnRedockPartyDisplayWindow" onclick="window.redockPartyDisplayWindow()" style="height: 26px; padding: 0 10px; font-size: var(--font-size-fine-print, 12px); font-weight: 600; cursor: pointer;">
        ⬅ Re-dock
      </button>
    </div>
  </div>

  <!-- Party Table Container -->
  <div class="party-win-container">
    <table class="data-table" id="tableSessionPartyRoster" style="width: 100%; border-collapse: collapse; min-width: 680px;">
      <thead>
        <tr>
          <th style="width: 220px; text-align: left;">Character</th>
          <th style="width: 55px; text-align: center;">Init</th>
          <th style="width: 125px; text-align: center;">PL / Def / Tough</th>
          <th style="width: 170px; text-align: center;">Damage (Bruised / Injured)</th>
          <th style="text-align: left;">Active Conditions</th>
        </tr>
      </thead>
      <tbody id="tbodySessionPartyRoster">
        <!-- Dynamically populated party rows -->
      </tbody>
    </table>
  </div>

  <!-- Scripts -->
  <script src="dice_notation.js?v=3"></script>
  <script src="campaign_manager.js?v=7"></script>
  <script src="session_network.js?v=6"></script>
  <script>
    const STORAGE_KEY_BOUNDS = 'mm2e_party_display_bounds';

    // ==========================================
    // 1. RE-DOCKING LOGIC (Declared first so it's always ready)
    // ==========================================
    function redockPartyDisplayWindow() {
      saveWindowBounds();

      // 1. Broadcast docking notification over mm2e_session_channel
      try {
        if (typeof SessionNetwork !== 'undefined' && typeof SessionNetwork.sendLocalBroadcast === 'function') {
          SessionNetwork.sendLocalBroadcast({ type: 'PARTY_DISPLAY_DOCKED' });
          SessionNetwork.sendLocalBroadcast({ type: 'POPOUT_DOCKED' });
        }
      } catch (e) {}

      try {
        if (typeof BroadcastChannel !== 'undefined') {
          const bc = new BroadcastChannel('mm2e_session_channel');
          bc.postMessage({ type: 'PARTY_DISPLAY_DOCKED' });
          bc.postMessage({ type: 'POPOUT_DOCKED' });
        }
      } catch (e) {}

      // 2. Safe call to opener if permitted
      try {
        if (window.opener && !window.opener.closed && typeof window.opener.redockPartyDisplay === 'function') {
          window.opener.redockPartyDisplay();
        }
      } catch (e) {}

      // 3. Always close this window
      try {
        window.close();
      } catch (e) {}
    }
    window.redockPartyDisplayWindow = redockPartyDisplayWindow;
    window.redockWindow = redockPartyDisplayWindow;

    const btnRedock = document.getElementById('btnRedockPartyDisplayWindow');
    if (btnRedock) {
      btnRedock.addEventListener('click', redockPartyDisplayWindow);
    }

    // ==========================================
    // 2. BOUNDS PERSISTENCE (Size & Position)
    // ==========================================
    function saveWindowBounds() {
      try {
        const left = (window.screenX !== undefined) ? window.screenX : window.screenLeft;
        const top = (window.screenY !== undefined) ? window.screenY : window.screenTop;
        const width = window.outerWidth || window.innerWidth;
        const height = window.outerHeight || window.innerHeight;

        if (typeof left === 'number' && typeof top === 'number' && width >= 200 && height >= 150) {
          const bounds = { left, top, width, height };
          localStorage.setItem(STORAGE_KEY_BOUNDS, JSON.stringify(bounds));
          try {
            if (typeof SessionNetwork !== 'undefined' && typeof SessionNetwork.sendLocalBroadcast === 'function') {
              SessionNetwork.sendLocalBroadcast({ type: 'PARTY_BOUNDS_UPDATE', bounds });
            }
          } catch (e) {}
        }
      } catch (e) {}
    }
    window.saveWindowBounds = saveWindowBounds;

    function restoreWindowBounds() {
      try {
        const saved = localStorage.getItem(STORAGE_KEY_BOUNDS);
        if (saved) {
          const b = JSON.parse(saved);
          if (typeof b.width === 'number' && typeof b.height === 'number' && b.width >= 200 && b.height >= 150) {
            if (window.outerWidth !== b.width || window.outerHeight !== b.height) {
              try { window.resizeTo(b.width, b.height); } catch (e) {}
            }
          }
          if (typeof b.left === 'number' && typeof b.top === 'number') {
            if (window.screenX !== b.left || window.screenY !== b.top) {
              try { window.moveTo(b.left, b.top); } catch (e) {}
            }
          }
        }
      } catch (e) {}
    }

    // Restore bounds immediately and on load
    restoreWindowBounds();
    window.addEventListener('DOMContentLoaded', restoreWindowBounds);
    window.addEventListener('load', restoreWindowBounds);

    // Track resize
    window.addEventListener('resize', () => {
      clearTimeout(window._resTimer);
      window._resTimer = setTimeout(saveWindowBounds, 200);
    });

    // Periodic poll for position changes (handling user dragging the window)
    setInterval(() => {
      const left = (window.screenX !== undefined) ? window.screenX : window.screenLeft;
      const top = (window.screenY !== undefined) ? window.screenY : window.screenTop;
      const width = window.outerWidth || window.innerWidth;
      const height = window.outerHeight || window.innerHeight;

      if (!window._lastBounds ||
          window._lastBounds.left !== left ||
          window._lastBounds.top !== top ||
          window._lastBounds.width !== width ||
          window._lastBounds.height !== height) {
        window._lastBounds = { left, top, width, height };
        saveWindowBounds();
      }
    }, 500);

    window.addEventListener('beforeunload', () => {
      saveWindowBounds();
      try {
        if (typeof SessionNetwork !== 'undefined' && typeof SessionNetwork.sendLocalBroadcast === 'function') {
          SessionNetwork.sendLocalBroadcast({ type: 'PARTY_DISPLAY_DOCKED' });
          SessionNetwork.sendLocalBroadcast({ type: 'POPOUT_DOCKED' });
        }
      } catch (e) {}
      try {
        if (window.opener && !window.opener.closed && typeof window.opener.redockPartyDisplay === 'function') {
          window.opener.redockPartyDisplay();
        }
      } catch (e) {}
    });

    window.addEventListener('unload', saveWindowBounds);
    window.addEventListener('pagehide', saveWindowBounds);

    // ==========================================
    // 3. TWO-WAY ACTION FORWARDING & LIVE SYNC
    // ==========================================
    function callOpenerOrBroadcast(fnName, ...args) {
      // 1. Try opener directly if accessible
      try {
        if (window.opener && !window.opener.closed && typeof window.opener[fnName] === 'function') {
          const res = window.opener[fnName](...args);
          syncPartyFromOpenerOrLocal();
          return res;
        }
      } catch (e) {}

      // 2. Broadcast action to main window
      try {
        if (typeof SessionNetwork !== 'undefined' && typeof SessionNetwork.sendLocalBroadcast === 'function') {
          SessionNetwork.sendLocalBroadcast({ type: 'PARTY_ACTION', action: fnName, args: args });
        }
      } catch (e) {}
      syncPartyFromOpenerOrLocal();
    }

    window.gmToggleCondition = (id, isNpc, cond) => callOpenerOrBroadcast('gmToggleCondition', id, isNpc, cond);
    window.gmAddConditionSelect = (id, isNpc, selectElem) => {
      const val = selectElem ? selectElem.value : null;
      if (val) {
        callOpenerOrBroadcast('gmToggleCondition', id, isNpc, val);
        selectElem.selectedIndex = 0;
      }
    };
    window.gmClearAllConditions = (id, isNpc) => callOpenerOrBroadcast('gmClearAllConditions', id, isNpc);
    window.gmStepDamage = (id, type, delta, isNpc) => callOpenerOrBroadcast('gmStepDamage', id, type, delta, isNpc);
    window.gmStepBruises = (id, isNpc, condName, delta) => callOpenerOrBroadcast('gmStepBruises', id, isNpc, condName, delta);
    window.sessionSpendHeroPoint = (id) => callOpenerOrBroadcast('sessionSpendHeroPoint', id);
    window.rollInitiativeCheck = () => callOpenerOrBroadcast('rollInitiativeCheck');
    window.gmTogglePlayerSilentBtn = (id) => callOpenerOrBroadcast('gmTogglePlayerSilentBtn', id);
    window.gmPullSheet = (id) => callOpenerOrBroadcast('gmPullSheet', id);
    window.gmPushCurrentSheet = (id) => callOpenerOrBroadcast('gmPushCurrentSheet', id);
    window.gmLoadNpcToEditor = (id) => callOpenerOrBroadcast('gmLoadNpcToEditor', id);
    window.gmExportCharSheet = (id) => callOpenerOrBroadcast('gmExportCharSheet', id);
    window.gmOpenCharHistory = (id) => callOpenerOrBroadcast('gmOpenCharHistory', id);

    // Dropdown menu handling
    window.gmToggleCharMenu = function(e, id) {
      e.stopPropagation();
      const menu = document.getElementById('gmCharMenu_' + id);
      const isOpen = menu && menu.style.display === 'block';
      window.gmCloseAllCharMenus();
      if (menu && !isOpen) menu.style.display = 'block';
    };
    window.gmCloseAllCharMenus = function() {
      document.querySelectorAll('.gm-char-dropdown-menu').forEach(m => m.style.display = 'none');
    };
    document.addEventListener('click', window.gmCloseAllCharMenus);

    function syncPartyFromOpenerOrLocal() {
      const tableRoster = document.getElementById('tbodySessionPartyRoster');
      if (!tableRoster) return;

      // 1. Try reading from opener safely
      try {
        if (window.opener && !window.opener.closed && window.opener.document) {
          const openerTbody = window.opener.document.getElementById('tbodySessionPartyRoster');
          if (openerTbody && openerTbody.innerHTML && openerTbody.innerHTML.trim().length > 0) {
            tableRoster.innerHTML = openerTbody.innerHTML;
            return;
          }
        }
      } catch (e) {}

      // 2. Request fresh HTML from main window via broadcast
      try {
        if (typeof SessionNetwork !== 'undefined' && typeof SessionNetwork.sendLocalBroadcast === 'function') {
          SessionNetwork.sendLocalBroadcast({ type: 'PARTY_REQ_ROSTER' });
        }
      } catch (e) {}
    }

    // Initialize BroadcastChannel via SessionNetwork
    if (typeof SessionNetwork !== 'undefined') {
      SessionNetwork.initBroadcastChannel();

      SessionNetwork.addEventListener('onPartyRosterHtml', (packet) => {
        if (packet && packet.html) {
          const tableRoster = document.getElementById('tbodySessionPartyRoster');
          if (tableRoster) tableRoster.innerHTML = packet.html;
        }
      });

      SessionNetwork.addEventListener('onConditionUpdate', () => syncPartyFromOpenerOrLocal());
      SessionNetwork.addEventListener('onRoll', () => syncPartyFromOpenerOrLocal());
      SessionNetwork.addEventListener('onHeroPointSpent', () => syncPartyFromOpenerOrLocal());
      SessionNetwork.addEventListener('onRosterUpdate', () => syncPartyFromOpenerOrLocal());
      SessionNetwork.addEventListener('onStateSync', () => syncPartyFromOpenerOrLocal());
      SessionNetwork.addEventListener('onThemeChange', (packet) => {
        if (packet && packet.theme) {
          localStorage.setItem('mm2e_theme', packet.theme);
        }
        if (window.__applySavedThemeAndFonts) window.__applySavedThemeAndFonts();
      });
    }

    // Initial render and interval sync
    syncPartyFromOpenerOrLocal();
    setInterval(syncPartyFromOpenerOrLocal, 2000);
  </script>
</body>
</html>
