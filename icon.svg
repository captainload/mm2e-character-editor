<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Gradient: Deep Obsidian Midnight -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="50%" stop-color="#090d16" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>

    <!-- Outer Rim Gradient -->
    <linearGradient id="rimGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#dc2626" stop-opacity="0.8" />
      <stop offset="50%" stop-color="#f59e0b" stop-opacity="0.6" />
      <stop offset="100%" stop-color="#991b1b" stop-opacity="0.3" />
    </linearGradient>

    <!-- Superhero Crimson Shield Gradient -->
    <linearGradient id="crimsonGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ef4444" />
      <stop offset="35%" stop-color="#dc2626" />
      <stop offset="85%" stop-color="#991b1b" />
      <stop offset="100%" stop-color="#7f1d1d" />
    </linearGradient>

    <!-- Radiant Heroic Gold Gradient -->
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fffbeb" />
      <stop offset="25%" stop-color="#fde047" />
      <stop offset="60%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#b45309" />
    </linearGradient>

    <!-- Metallic Platinum/Silver Gradient -->
    <linearGradient id="silverGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="40%" stop-color="#f1f5f9" />
      <stop offset="75%" stop-color="#cbd5e1" />
      <stop offset="100%" stop-color="#94a3b8" />
    </linearGradient>

    <!-- Drop Shadow Filter -->
    <filter id="dropShadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#000000" flood-opacity="0.6" />
    </filter>

    <!-- Lightning Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Base App Tile (Rounded Square) -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)" stroke="url(#rimGrad)" stroke-width="4" />

  <!-- Shield Crest Outer Glow / Shadow -->
  <g filter="url(#dropShadow)">
    <!-- Heraldic Superhero Shield (Crimson Body) -->
    <path d="M 256 56 L 396 106 C 396 260 340 376 256 426 C 172 376 116 260 116 106 Z" 
          fill="url(#crimsonGrad)" stroke="url(#goldGrad)" stroke-width="8" stroke-linejoin="round" />
    
    <!-- Shield Inner Bevel Line -->
    <path d="M 256 74 L 380 118 C 380 252 330 356 256 402 C 182 356 132 252 132 118 Z" 
          fill="none" stroke="rgba(255, 255, 255, 0.25)" stroke-width="2.5" />
  </g>

  <!-- Superhero 'M' Wings & Spire -->
  <g filter="url(#dropShadow)">
    <!-- Left Wing of 'M' -->
    <path d="M 164 300 L 164 148 L 216 148 L 244 252 L 204 252 L 204 300 Z" 
          fill="url(#silverGrad)" stroke="#64748b" stroke-width="1.5" />
    
    <!-- Right Wing of 'M' -->
    <path d="M 348 300 L 348 148 L 296 148 L 268 252 L 308 252 L 308 300 Z" 
          fill="url(#silverGrad)" stroke="#64748b" stroke-width="1.5" />

    <!-- Center Power Lightning Bolt in Heroic Gold -->
    <polygon points="256,132 292,236 252,236 276,326 220,218 256,218" 
             fill="url(#goldGrad)" filter="url(#glow)" stroke="#b45309" stroke-width="1.5" />
  </g>

  <!-- '2E' Badge at Bottom of Crest -->
  <g filter="url(#dropShadow)" transform="translate(0, 8)">
    <!-- Badge Background Plate -->
    <rect x="186" y="348" width="140" height="54" rx="27" 
          fill="#090d16" stroke="url(#goldGrad)" stroke-width="4.5" />
    
    <!-- Inner Accent Rim -->
    <rect x="190" y="352" width="132" height="46" rx="23" 
          fill="none" stroke="rgba(245, 158, 11, 0.4)" stroke-width="1.5" />

    <!-- '2E' Version Text -->
    <text x="256" y="386" 
          font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" 
          font-weight="900" 
          font-size="32" 
          fill="url(#goldGrad)" 
          text-anchor="middle" 
          letter-spacing="2"
          stroke="#78350f"
          stroke-width="1">2E</text>
  </g>
</svg>
