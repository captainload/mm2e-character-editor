<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>MM2CG — Session Log</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="styles.css?v=67">
  <script>
    (function() {
      function applySavedThemeAndFonts() {
        const root = document.documentElement;
        const savedTheme = localStorage.getItem("mm2e_theme") || "light";
        root.setAttribute("data-theme", savedTheme);

        const savedLabelFont = Math.max(14, parseInt(localStorage.getItem("mm2e_font_labels") || localStorage.getItem("mm4e_font_labels") || "16", 10));
        const savedControlFont = Math.max(12, parseInt(localStorage.getItem("mm2e_font_controls") || localStorage.getItem("mm4e_font_controls") || "14", 10));
        const savedTagFont = Math.max(10, parseInt(localStorage.getItem("mm2e_font_tags") || localStorage.getItem("mm2e_font_links") || localStorage.getItem("mm4e_font_links") || "13", 10));
        const savedSecondaryFont = Math.max(12, parseInt(localStorage.getItem("mm2e_font_secondary") || localStorage.getItem("mm4e_font_secondary") || "14", 10));
        const savedMinorControlFont = Math.max(11, parseInt(localStorage.getItem("mm2e_font_minor_controls") || localStorage.getItem("mm4e_font_minor_controls") || "15", 10));
        const savedFinePrintFont = Math.max(10, parseInt(localStorage.getItem("mm2e_font_fine_print") || "13", 10));

        root.style.setProperty("--font-size-labels", savedLabelFont + "px");
        root.style.setProperty("--font-size-controls", savedControlFont + "px");
        root.style.setProperty("--font-size-tags", savedTagFont + "px");
        root.style.setProperty("--font-size-links", savedTagFont + "px");
        root.style.setProperty("--font-size-secondary", savedSecondaryFont + "px");
        root.style.setProperty("--font-size-minor-controls", savedMinorControlFont + "px");
        root.style.setProperty("--font-size-fine-print", savedFinePrintFont + "px");
      }
      applySavedThemeAndFonts();
      window.__applySavedThemeAndFonts = applySavedThemeAndFonts;
      window.addEventListener("storage", function(e) {
        if (!e.key || e.key.startsWith("mm2e_") || e.key.startsWith("mm4e_")) {
          applySavedThemeAndFonts();
        }
      });
    })();
  </script>
  <style>
    body {
      margin: 0;
      padding: 12px;
      background: var(--bg-app);
      color: var(--text-main);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      display: flex;
      flex-direction: column;
      height: 100vh;
      box-sizing: border-box;
      overflow: hidden;
    }
    .log-header-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      padding-bottom: 8px;
      border-bottom: 1px solid var(--border-color);
      flex-shrink: 0;
    }
    .search-filter-box {
      display: flex;
      align-items: center;
      gap: 6px;
      margin-top: 8px;
      flex-shrink: 0;
    }
    .filter-chips {
      display: flex;
      gap: 4px;
      overflow-x: auto;
      margin-top: 6px;
      padding-bottom: 4px;
      flex-shrink: 0;
    }
    .filter-chip {
      padding: 2px 8px;
      font-size: var(--font-size-fine-print, 12px);
      border-radius: 12px;
      border: 1px solid var(--border-color, #3f3f46);
      background: var(--bg-panel, #27272a);
      color: var(--text-muted, #a1a1aa);
      cursor: pointer;
      white-space: nowrap;
    }
    .filter-chip.active {
      background: var(--accent-primary, #dc2626);
      color: #fff;
      border-color: var(--accent-primary, #dc2626);
      font-weight: 600;
    }
    .party-hud-bar {
      display: flex;
      gap: 6px;
      overflow-x: auto;
      padding: 6px 0;
      border-bottom: 1px solid var(--border-color, #27272a);
      flex-shrink: 0;
    }
    .log-feed-container {
      flex: 1;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 8px;
      padding: 8px 0;
    }
    .quick-dice-tray {
      display: flex;
      gap: 6px;
      align-items: center;
      padding-top: 8px;
      border-top: 1px solid var(--border-color, #27272a);
      flex-shrink: 0;
    }
    .roll-card {
      background: var(--bg-panel, #27272a);
      border: 1px solid var(--border-color, #3f3f46);
      border-radius: 6px;
      padding: 8px 10px;
      display: flex;
      flex-direction: column;
      gap: 4px;
      transition: opacity 0.2s;
    }
    .roll-card.nat20 {
      border-color: #10b981;
      box-shadow: 0 0 6px rgba(16, 185, 129, 0.25);
    }
    .roll-card.nat1 {
      border-color: #ef4444;
      box-shadow: 0 0 6px rgba(239, 68, 68, 0.25);
    }
    .roll-card.silent {
      border-style: dashed;
      background: rgba(39, 39, 42, 0.6);
    }
    .roll-card.hp-enhanced {
      border-color: #f59e0b;
      box-shadow: 0 0 8px rgba(245, 158, 11, 0.25);
      background: linear-gradient(to right, rgba(245, 158, 11, 0.08), var(--bg-panel, #27272a));
    }
    .roll-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: var(--font-size-secondary, 13px);
    }
    .roll-math {
      font-family: inherit;
      font-size: var(--font-size-controls, 13px);
      color: var(--text-main);
      display: inline-flex;
      align-items: baseline;
      gap: 4px;
    }
    .log-roll-formula {
      font-family: inherit;
      color: var(--text-muted);
      font-weight: 500;
    }
    .log-total-result {
      font-family: inherit;
      font-size: 1.15em;
      font-weight: 800;
      color: var(--accent-primary, #1d4ed8);
      background: rgba(99, 102, 241, 0.12);
      border: 1px solid rgba(99, 102, 241, 0.3);
      border-radius: 4px;
      padding: 1px 6px;
      display: inline-block;
      letter-spacing: 0.3px;
    }
    .roll-result {
      font-size: var(--font-size-secondary, 13px);
      font-weight: 600;
    }
  </style>
</head>
<body>

  <!-- Header -->
  <div class="log-header-bar">
    <div style="display: flex; align-items: center; gap: 8px;">
      <strong style="font-size: var(--font-size-labels, 16px); display: flex; align-items: center; gap: 6px;">
        📜 Session Log
      </strong>
      <span class="badge" id="lblPopoutStatus" style="background: rgba(16, 185, 129, 0.15); color: #10b981; border: 1px solid #10b981; font-size: 11px;">🟢 Active</span>
    </div>
    <div style="display: flex; align-items: center; gap: 6px;">
      <button type="button" class="btn btn-secondary" id="btnClearLog" style="font-size: var(--font-size-fine-print, 12px); padding: 2px 8px; height: 24px;">Clear</button>
      <button type="button" class="btn btn-secondary" onclick="redockWindow()" style="font-size: var(--font-size-fine-print, 12px); padding: 2px 8px; height: 24px;" title="Close and re-dock into main window">Re-dock</button>
    </div>
  </div>

  <!-- Search & Filter Bar -->
  <div class="search-filter-box">
    <input type="text" id="txtLogSearch" placeholder="Search rolls... (e.g. Doctor, Toughness, Failed, nat20)" style="flex: 1; height: 28px; font-size: var(--font-size-secondary, 13px); background: var(--bg-card, #18181b); border: 1px solid var(--border-color, #3f3f46); color: var(--text-main, #f4f4f5); border-radius: 4px; padding: 0 8px;">
    <button type="button" class="btn btn-secondary" id="btnClearSearch" style="height: 28px; padding: 0 8px; font-size: 12px;" title="Clear search">✕</button>
  </div>

  <!-- Filter Chips -->
  <div class="filter-chips">
    <button type="button" class="filter-chip active" data-filter="all">All</button>
    <button type="button" class="filter-chip" data-filter="attack">Attacks</button>
    <button type="button" class="filter-chip" data-filter="save">Saves</button>
    <button type="button" class="filter-chip" data-filter="check">Checks</button>
    <button type="button" class="filter-chip" data-filter="hp" title="Show only rolls that used Hero Points">HP</button>
    <button type="button" class="filter-chip" data-filter="nat20">Nat 20</button>
    <button type="button" class="filter-chip" data-filter="failed">Failed</button>
    <button type="button" class="filter-chip" data-filter="silent">Silent</button>
  </div>

  <!-- Party Status HUD -->
  <div class="party-hud-bar" id="popoutPartyHud">
    <span class="secondary-text" style="font-size: var(--font-size-fine-print, 12px); font-style: italic;">Party Status: Standby</span>
  </div>

  <!-- Log Feed -->
  <div class="log-feed-container" id="popoutLogFeed">
    <div style="text-align: center; color: var(--text-muted, #a1a1aa); font-size: var(--font-size-secondary, 13px); margin-top: 24px; font-style: italic;">
      No rolls or events recorded yet in this session.
    </div>
  </div>

  <!-- Quick Dice Tray -->
  <div class="quick-dice-tray">
    <input type="text" id="txtPopoutDice" placeholder="1d20+5, 2d6+3..." style="flex: 1; height: 28px; font-size: var(--font-size-secondary, 13px); background: var(--bg-card, #18181b); border: 1px solid var(--border-color, #3f3f46); color: var(--text-main, #f4f4f5); border-radius: 4px; padding: 0 8px;">
    <button type="button" class="btn btn-primary" id="btnPopoutRoll" style="height: 28px; padding: 0 12px; font-weight: bold; font-size: var(--font-size-secondary, 13px);">🎲 Roll</button>
  </div>

  <!-- Scripts -->
  <script src="dice_notation.js?v=3"></script>
  <script src="session_network.js?v=19"></script>
  <script>
    const allRollCards = [];
    let currentFilter = 'all';
    let searchQuery = '';

    const feed = document.getElementById('popoutLogFeed');
    const txtSearch = document.getElementById('txtLogSearch');
    const btnClearSearch = document.getElementById('btnClearSearch');
    const filterButtons = document.querySelectorAll('.filter-chip');
    const txtDice = document.getElementById('txtPopoutDice');
    const btnRoll = document.getElementById('btnPopoutRoll');
    const btnClear = document.getElementById('btnClearLog');

    SessionNetwork.initBroadcastChannel();

    function renderFeed() {
      if (allRollCards.length === 0) {
        feed.innerHTML = `<div style="text-align: center; color: var(--text-muted); font-size: var(--font-size-secondary); margin-top: 24px; font-style: italic;">No rolls or events recorded yet in this session.</div>`;
        return;
      }

      const q = searchQuery.toLowerCase().trim();
      const filtered = allRollCards.filter(item => {
        // Filter chips
        if (currentFilter === 'attack' && !item.rollType?.toLowerCase().includes('attack')) return false;
        if (currentFilter === 'save' && !item.rollType?.toLowerCase().includes('save') && !item.rollType?.toLowerCase().includes('toughness')) return false;
        if (currentFilter === 'check' && !item.rollType?.toLowerCase().includes('check')) return false;
        if (currentFilter === 'hp') {
          const hasHp = (typeof item.hpBonus === 'number' && item.hpBonus > 0) ||
                        !!item.isHPRerolled ||
                        !!(item.hpAnnouncement && item.hpAnnouncement.trim()) ||
                        !!(item.rollType && (item.rollType.includes('+5 HP') || item.rollType.includes('HP Reroll') || item.rollType.includes('✨ HP')));
          if (!hasHp) return false;
        }
        if (currentFilter === 'nat20' && !item.isNat20) return false;
        if (currentFilter === 'failed' && !item.result?.toLowerCase().includes('fail')) return false;
        if (currentFilter === 'silent' && !item.isSilent) return false;

        // Search expression
        if (!q) return true;
        const searchTarget = `${item.characterName || ''} ${item.playerName || ''} ${item.rollType || ''} ${item.expression || ''} ${item.result || ''} ${item.breakdown || ''}`.toLowerCase();
        return searchTarget.includes(q);
      });

      if (filtered.length === 0) {
        feed.innerHTML = `<div style="text-align: center; color: var(--text-muted); font-size: var(--font-size-secondary); margin-top: 24px; font-style: italic;">No rolls match current search / filter.</div>`;
        return;
      }

      function escapeHtml(str) {
        return String(str || '').replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
      }

      feed.innerHTML = filtered.map(item => {
        const time = item.timestamp ? new Date(item.timestamp).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit', second: '2-digit' }) : '';
        const natClass = item.isNat20 ? 'nat20' : (item.isNat1 ? 'nat1' : '');
        const silentClass = item.isSilent ? 'silent' : '';
        const silentBadge = item.isSilent ? `<span class="badge" style="background: rgba(245, 158, 11, 0.15); color: #f59e0b; border: 1px solid #f59e0b; font-size: 11px;">🔇 Silent</span>` : '';
        const natBadge = item.isNat20 ? `<span class="badge" style="background: rgba(16, 185, 129, 0.15); color: #10b981; border: 1px solid #10b981; font-size: 11px;">★ Natural 20</span>` : (item.isNat1 ? `<span class="badge" style="background: rgba(239, 68, 68, 0.15); color: #ef4444; border: 1px solid #ef4444; font-size: 11px;">⚠ Natural 1</span>` : '');

        const hasHpBonus = typeof item.hpBonus === 'number' && item.hpBonus > 0;
        const isHpReroll = !!item.isHPRerolled;
        const hpClass = (hasHpBonus || isHpReroll) ? 'hp-enhanced' : '';
        let hpBadge = '';
        if (isHpReroll || (item.rollType && item.rollType.includes('HP Reroll'))) {
          hpBadge = `<span class="badge" style="background: rgba(245, 158, 11, 0.2); color: #f59e0b; border: 1px solid #f59e0b; font-size: 11px; font-weight: bold;">✨ HP Reroll</span>`;
        }

        let hpAnnouncementText = '';
        if (item.hpAnnouncement) {
          hpAnnouncementText = item.hpAnnouncement.replace(/\bHero Point\b/g, 'HP').replace(/^HP:\s*\+/i, '+').replace(/^HP\s*\+/i, '+');
        } else if (hasHpBonus) {
          hpAnnouncementText = `+${item.hpBonus} (Improve Roll)`;
        } else if (isHpReroll) {
          hpAnnouncementText = item.rerollInfo ? `HP Reroll: ${item.rerollInfo.replace(/\bHero Point\b/g, 'HP')}` : `HP Reroll (min 11–20 floor)`;
        } else if (item.rollType && item.rollType.includes('+5 HP')) {
          hpAnnouncementText = `+5 (Improve Roll)`;
        } else if (item.rollType && item.rollType.includes('HP Reroll')) {
          hpAnnouncementText = `HP Reroll (min 11–20 floor)`;
        }
        const hpAnnouncementHtml = hpAnnouncementText ? ` <span style="color: #f59e0b; font-size: 11px; font-weight: 600; margin-left: 4px;">[✨ ${escapeHtml(hpAnnouncementText)}]</span>` : '';

        const cleanRollType = (item.rollType || 'Roll')
          .replace(/\s*\(\s*✨?\s*\+?\d*\s*HP\s*\)/gi, '')
          .replace(/\s*\(\s*✨?\s*HP\s*Reroll\s*\)/gi, '')
          .trim();

        let mathSnippet = '';
        if (item.breakdown) {
          const rawBreakdown = String(item.breakdown);
          const eqIdx = rawBreakdown.lastIndexOf('=');
          if (eqIdx !== -1) {
            const formulaPart = rawBreakdown.substring(0, eqIdx).trim();
            const totalPart = rawBreakdown.substring(eqIdx + 1).trim();
            mathSnippet = `<span class="log-roll-formula">${escapeHtml(formulaPart)}</span> <span style="font-weight: 600; color: var(--text-muted);">=</span> <strong class="log-total-result">${escapeHtml(totalPart)}</strong>`;
          } else {
            mathSnippet = `<span class="log-roll-formula">${escapeHtml(rawBreakdown)}</span>`;
          }
        } else {
          mathSnippet = `<strong class="log-total-result">${item.total !== undefined ? item.total : ''}</strong>`;
        }

        return `
          <div class="roll-card ${natClass} ${silentClass} ${hpClass}">
            <div class="roll-header">
              <div>
                <strong>${escapeHtml(item.characterName || 'Hero')}</strong>
                <span style="color: var(--text-muted); font-size: 11px; margin-left: 4px;">(${escapeHtml(item.playerName || 'Player')})</span>
              </div>
              <div style="display: flex; align-items: center; gap: 4px;">
                ${silentBadge}
                ${natBadge}
                ${hpBadge}
                <span style="color: var(--text-muted); font-size: 11px;">${time}</span>
              </div>
            </div>
            <div style="display: flex; justify-content: space-between; align-items: baseline; margin-top: 2px; flex-wrap: wrap; gap: 4px;">
              <span style="font-size: 12px; color: var(--text-muted); font-weight: 600;">${escapeHtml(cleanRollType)}</span>
              <span class="roll-math">${mathSnippet}${hpAnnouncementHtml}</span>
            </div>
            ${item.result ? `<div class="roll-result" style="color: ${item.result.toLowerCase().includes('fail') ? '#ef4444' : '#10b981'};">${escapeHtml(item.result)}</div>` : ''}
          </div>
        `;
      }).join('');
    }

    SessionNetwork.addEventListener('onRoll', (roll) => {
      allRollCards.unshift(roll);
      renderFeed();
    });

    SessionNetwork.addEventListener('onConditionUpdate', (update) => {
      // Update party status
      const hud = document.getElementById('popoutPartyHud');
      if (hud) {
        hud.innerHTML = `<span class="badge" style="background: rgba(2, 132, 199, 0.15); color: #0284c9; border: 1px solid #0284c9;">${update.characterName}: Bruises ${update.bruises || 0}</span>`;
      }
    });

    // Search and Filters
    txtSearch.addEventListener('input', (e) => {
      searchQuery = e.target.value;
      renderFeed();
    });

    btnClearSearch.addEventListener('click', () => {
      txtSearch.value = '';
      searchQuery = '';
      renderFeed();
    });

    filterButtons.forEach(btn => {
      btn.addEventListener('click', () => {
        filterButtons.forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        currentFilter = btn.dataset.filter || 'all';
        renderFeed();
      });
    });

    // Quick Dice Roll
    btnRoll.addEventListener('click', () => {
      const expr = txtDice.value.trim() || '1d20';
      const d20Match = expr.match(/^1?d20(?:\s*([+-]\s*\d+))?$/i);
      let rolled = null;
      let hpBonus = 0;
      let isHPRerolled = false;
      let hpAnnouncement = '';

      if (d20Match && window.opener && typeof window.opener.performD20RollWithHP === 'function') {
        const baseMod = d20Match[1] ? parseInt(d20Match[1].replace(/\s+/g, '')) : 0;
        const r = window.opener.performD20RollWithHP(baseMod);
        rolled = {
          total: r.total,
          breakdown: r.hpBonus > 0
            ? `1d20 (${r.d20}) ${r.baseMod >= 0 ? '+' + r.baseMod : r.baseMod} [Base] + ${r.hpBonus} [✨ HP] = ${r.total}`
            : (r.isHPRerolled && r.rawD20 <= 10
               ? `1d20 (${r.rawD20} + 10 floor = ${r.d20}) ${r.mod >= 0 ? '+' + r.mod : r.mod} = ${r.total}`
               : `1d20 (${r.d20}) ${r.mod >= 0 ? '+' + r.mod : r.mod} = ${r.total}`),
          isNat20: r.isNat20,
          isNat1: r.isNat1
        };
        hpBonus = r.hpBonus;
        isHPRerolled = r.isHPRerolled;
        hpAnnouncement = r.hpAnnouncement;
      } else {
        rolled = (typeof DiceNotation !== 'undefined') ? DiceNotation.roll(expr) : { total: Math.floor(Math.random() * 20) + 1, breakdown: expr, isNat20: false, isNat1: false };
      }

      const charName = (window.opener && window.opener.char && window.opener.char.name) ? window.opener.char.name : 'Popout User';
      const hpSuffix = (hpBonus > 0 ? ` (✨ +${hpBonus} HP)` : '') + (isHPRerolled ? ' (✨ HP Reroll)' : '');
      SessionNetwork.sendRoll({
        characterName: charName,
        rollType: `Dice (${expr})${hpSuffix}`,
        expression: expr,
        total: rolled.total,
        breakdown: rolled.breakdown || `${rolled.total}`,
        isNat20: !!rolled.isNat20,
        isNat1: !!rolled.isNat1,
        hpBonus,
        isHPRerolled,
        hpAnnouncement
      });
    });

    txtDice.addEventListener('keydown', (e) => {
      if (e.key === 'Enter') {
        btnRoll.click();
      }
    });

    btnClear.addEventListener('click', () => {
      allRollCards.length = 0;
      renderFeed();
    });

    // --- Window Bounds Persistence (Size & Position) ---
    const STORAGE_KEY_BOUNDS = 'mm2e_session_log_bounds';

    function getInitialBounds() {
      const fallback = { width: 750, height: 600, left: 160, top: 160 };
      try {
        const p = new URLSearchParams(window.location.search);
        const urlW = parseInt(p.get('w'), 10);
        const urlH = parseInt(p.get('h'), 10);
        const urlX = parseInt(p.get('x'), 10);
        const urlY = parseInt(p.get('y'), 10);
        if (urlW >= 250 && urlH >= 200) {
          return {
            width: urlW,
            height: urlH,
            left: !isNaN(urlX) ? urlX : fallback.left,
            top: !isNaN(urlY) ? urlY : fallback.top
          };
        }
      } catch (e) {}

      try {
        const saved = localStorage.getItem(STORAGE_KEY_BOUNDS);
        if (saved) {
          const b = JSON.parse(saved);
          if (b && b.width >= 250 && b.height >= 200) {
            return {
              width: Math.round(b.width),
              height: Math.round(b.height),
              left: Math.round(b.left ?? fallback.left),
              top: Math.round(b.top ?? fallback.top)
            };
          }
        }
      } catch (e) {}

      return fallback;
    }

    let _isInitialLoad = true;
    setTimeout(() => { _isInitialLoad = false; }, 800);
    let _isRestoringBounds = false;

    window._lastBounds = getInitialBounds();

    function saveWindowBounds() {
      try {
        const left = Math.round((window.screenX !== undefined) ? window.screenX : window.screenLeft);
        const top = Math.round((window.screenY !== undefined) ? window.screenY : window.screenTop);
        const width = Math.round(window.innerWidth || window.outerWidth);
        const height = Math.round(window.innerHeight || window.outerHeight);

        if (typeof left === 'number' && !isNaN(left) && typeof top === 'number' && !isNaN(top) && width >= 250 && height >= 200) {
          const bounds = { left, top, width, height };
          try {
            localStorage.setItem(STORAGE_KEY_BOUNDS, JSON.stringify(bounds));
          } catch (e) {}

          try {
            if (window.opener && !window.opener.closed) {
              window.opener.postMessage({
                type: 'MM2E_WINDOW_BOUNDS',
                key: STORAGE_KEY_BOUNDS,
                popupType: 'log',
                bounds: bounds
              }, '*');
            }
          } catch (e) {}

          try {
            if (typeof SessionNetwork !== 'undefined' && typeof SessionNetwork.sendLocalBroadcast === 'function') {
              SessionNetwork.sendLocalBroadcast({ type: 'LOG_BOUNDS_UPDATE', bounds });
            }
          } catch (e) {}
        }
      } catch (e) {}
    }

    function restoreWindowBounds() {
      try {
        const b = getInitialBounds();
        if (!b) return;

        const curW = window.innerWidth || window.outerWidth;
        const curH = window.innerHeight || window.outerHeight;
        const curX = (window.screenX !== undefined) ? window.screenX : window.screenLeft;
        const curY = (window.screenY !== undefined) ? window.screenY : window.screenTop;

        if (!curW || !curH || curW < 100 || curH < 100) return;

        _isRestoringBounds = true;
        try {
          if (typeof b.left === 'number' && typeof b.top === 'number') {
            if (Math.abs(curX - b.left) > 25 || Math.abs(curY - b.top) > 25) {
              window.moveTo(b.left, b.top);
            }
          }
          if (typeof b.width === 'number' && typeof b.height === 'number' && b.width >= 250 && b.height >= 200) {
            if (Math.abs(curW - b.width) > 40 || Math.abs(curH - b.height) > 40) {
              const chromeW = (window.outerWidth && window.innerWidth) ? (window.outerWidth - window.innerWidth) : 16;
              const chromeH = (window.outerHeight && window.innerHeight) ? (window.outerHeight - window.innerHeight) : 40;
              window.resizeTo(b.width + chromeW, b.height + chromeH);
            }
          }
        } catch (e) {}
        setTimeout(() => { _isRestoringBounds = false; }, 400);
      } catch (e) {
        _isRestoringBounds = false;
      }
    }

    // Try restoring bounds after DOM is ready
    window.addEventListener('DOMContentLoaded', () => {
      setTimeout(restoreWindowBounds, 50);
    });
    window.addEventListener('load', restoreWindowBounds);

    // Track resize
    window.addEventListener('resize', () => {
      if (_isRestoringBounds || _isInitialLoad) return;
      clearTimeout(window._resTimer);
      window._resTimer = setTimeout(saveWindowBounds, 250);
    });

    // Periodic poll for position changes (handling user dragging the window)
    setInterval(() => {
      if (_isInitialLoad || _isRestoringBounds) return;
      const left = Math.round((window.screenX !== undefined) ? window.screenX : window.screenLeft);
      const top = Math.round((window.screenY !== undefined) ? window.screenY : window.screenTop);
      const width = Math.round(window.innerWidth || window.outerWidth);
      const height = Math.round(window.innerHeight || window.outerHeight);

      if (width < 250 || height < 200) return;

      if (!window._lastBounds ||
          Math.abs(window._lastBounds.left - left) > 4 ||
          Math.abs(window._lastBounds.top - top) > 4 ||
          Math.abs(window._lastBounds.width - width) > 4 ||
          Math.abs(window._lastBounds.height - height) > 4) {
        window._lastBounds = { left, top, width, height };
        saveWindowBounds();
      }
    }, 500);

    window.addEventListener('beforeunload', () => {
      saveWindowBounds();
      try {
        if (window.opener && !window.opener.closed) {
          window.opener.postMessage({ type: 'MM2E_POPOUT_DOCKED', popupType: 'log' }, '*');
        }
      } catch (e) {}
      if (typeof SessionNetwork !== 'undefined' && typeof SessionNetwork.sendLocalBroadcast === 'function') {
        SessionNetwork.sendLocalBroadcast({ type: 'POPOUT_DOCKED' });
      }
    });

    function redockWindow() {
      saveWindowBounds();
      try {
        if (window.opener && !window.opener.closed) {
          window.opener.postMessage({ type: 'MM2E_POPOUT_DOCKED', popupType: 'log' }, '*');
        }
      } catch (e) {}
      if (typeof SessionNetwork !== 'undefined' && typeof SessionNetwork.sendLocalBroadcast === 'function') {
        SessionNetwork.sendLocalBroadcast({ type: 'POPOUT_DOCKED' });
      }
      window.close();
    }
  </script>
