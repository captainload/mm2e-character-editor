<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6" />
      <stop offset="50%" stop-color="#1d4ed8" />
      <stop offset="100%" stop-color="#1e3a8a" />
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a" />
      <stop offset="50%" stop-color="#eab308" />
      <stop offset="100%" stop-color="#ca8a04" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background rounded rect -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)" />

  <g transform="translate(256, 256) scale(1.8) translate(-256, -272)">
    <!-- Stylized Superhero 'M' Emblem with Lightning Strike Center -->
    <!-- Left Leg -->
    <path d="M 160 340 L 160 160 L 210 160 L 236 280 L 196 280 L 196 340 Z" fill="#ffffff" filter="url(#glow)" />
    
    <!-- Right Leg -->
    <path d="M 352 340 L 352 160 L 302 160 L 276 280 L 316 280 L 316 340 Z" fill="#ffffff" filter="url(#glow)" />

    <!-- Center Golden Lightning Bolt / Peak -->
    <polygon points="256,150 290,260 250,260 274,350 220,240 256,240" fill="url(#goldGrad)" filter="url(#glow)" />
    
    <!-- '4E' Badge at bottom of crest -->
    <rect x="216" y="360" width="80" height="34" rx="8" fill="#0f172a" stroke="url(#goldGrad)" stroke-width="3" />
    <text x="256" y="385" font-family="-apple-system, system-ui, sans-serif" font-weight="900" font-size="20" fill="#facc15" text-anchor="middle" letter-spacing="1">4E</text>
  </g>
</svg>
