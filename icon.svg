<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Gradient: Deep Obsidian Midnight -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="50%" stop-color="#090d16" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>

    <!-- Outer Rim Gradient -->
    <linearGradient id="rimGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#dc2626" stop-opacity="0.85" />
      <stop offset="50%" stop-color="#f59e0b" stop-opacity="0.7" />
      <stop offset="100%" stop-color="#991b1b" stop-opacity="0.4" />
    </linearGradient>

    <!-- Superhero Crimson Shield Gradient -->
    <linearGradient id="crimsonGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ef4444" />
      <stop offset="30%" stop-color="#dc2626" />
      <stop offset="75%" stop-color="#991b1b" />
      <stop offset="100%" stop-color="#7f1d1d" />
    </linearGradient>

    <!-- Radiant Heroic Gold Gradient -->
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fffbeb" />
      <stop offset="25%" stop-color="#fde047" />
      <stop offset="60%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#b45309" />
    </linearGradient>

    <!-- Bright Text Gold Gradient -->
    <linearGradient id="goldBright" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="35%" stop-color="#fef08a" />
      <stop offset="75%" stop-color="#facc15" />
      <stop offset="100%" stop-color="#ca8a04" />
    </linearGradient>

    <!-- Metallic Platinum/Silver Gradient -->
    <linearGradient id="silverGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="35%" stop-color="#f8fafc" />
      <stop offset="70%" stop-color="#cbd5e1" />
      <stop offset="100%" stop-color="#94a3b8" />
    </linearGradient>

    <!-- Drop Shadow Filter -->
    <filter id="dropShadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#000000" flood-opacity="0.65" />
    </filter>

    <!-- Lightning Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Base App Tile (Rounded Square) -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)" stroke="url(#rimGrad)" stroke-width="4" />

  <!-- Shield Crest Outer Glow / Shadow -->
  <g filter="url(#dropShadow)">
    <!-- Heraldic Superhero Shield (Expanded to Maximize Canvas) -->
    <path d="M 256 24 L 468 86 C 468 280, 380 430, 256 488 C 132 430, 44 280, 44 86 Z" 
          fill="url(#crimsonGrad)" stroke="url(#goldGrad)" stroke-width="11" stroke-linejoin="round" />
    
    <!-- Shield Inner Bevel Line -->
    <path d="M 256 46 L 448 100 C 448 270, 370 406, 256 458 C 142 406, 64 270, 64 100 Z" 
          fill="none" stroke="rgba(255, 255, 255, 0.25)" stroke-width="3" />
  </g>

  <!-- Superhero 'M' Wings & Lightning (Enlarged) -->
  <g filter="url(#dropShadow)">
    <!-- Left Wing of 'M' -->
    <path d="M 116 336 L 116 150 L 184 150 L 236 276 L 180 276 L 180 336 Z" 
          fill="url(#silverGrad)" stroke="#475569" stroke-width="2" />
    
    <!-- Right Wing of 'M' -->
    <path d="M 396 336 L 396 150 L 328 150 L 276 276 L 332 276 L 332 336 Z" 
          fill="url(#silverGrad)" stroke="#475569" stroke-width="2" />

    <!-- Center Dynamic Lightning Bolt in Heroic Gold -->
    <polygon points="256,110 306,242 250,242 284,360 206,218 256,218" 
             fill="url(#goldGrad)" filter="url(#glow)" stroke="#b45309" stroke-width="2" />
  </g>

  <!-- Enlarged '2E' Badge at Bottom of Crest -->
  <g filter="url(#dropShadow)">
    <!-- Badge Background Plate -->
    <rect x="151" y="390" width="210" height="74" rx="37" 
          fill="#090d16" stroke="url(#goldGrad)" stroke-width="6" />
    
    <!-- Inner Accent Rim -->
    <rect x="156" y="395" width="200" height="64" rx="32" 
          fill="none" stroke="rgba(245, 158, 11, 0.45)" stroke-width="2" />

    <!-- '2E' Bold Version Text -->
    <text x="256" y="443" 
          font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" 
          font-weight="900" 
          font-size="52" 
          fill="url(#goldBright)" 
          text-anchor="middle" 
          letter-spacing="3"
          stroke="#78350f"
          stroke-width="2">2E</text>
  </g>
</svg>
